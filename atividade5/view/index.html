<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container mt-4 p-4 border rounded bg-light" style="max-width: 800px;">
    
    {{#erros}}
    <div class="alert alert-danger">
        {{.}}
    </div>
    {{/erros}}
    <h1 class="text-center text-primary mb-4">
        Dados do Paciente
    </h1>

    <form action="/agendamento" method="POST">

        <h3 class="mt-3 mb-3">Dados do Paciente</h3>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" name="nome" class="form-control" value="{{dados.nome}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">Sobrenome</label>
                <input type="text" name="sobrenome" class="form-control" value="{{dados.sobrenome}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">CPF</label>
                <input type="text" name="cpf" class="form-control" value="{{dados.cpf}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">Data de Nascimento</label>
                <input type="date" name="datanasc" class="form-control" value="{{dados.datanasc}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">Telefone</label>
                <input type="tel" name="telefone" class="form-control" value="{{dados.telefone}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">CEP</label>
                <input type="text" name="cep" class="form-control" value="{{dados.cep}}" >
            </div>

            <div class="col-12">
                <label class="form-label">Endereço</label>
                <input type="text" name="endereco" class="form-control" value="{{dados.endereco}}" >
            </div>

        </div>

        <h3 class="mt-4 mb-3">Dados da Consulta</h3>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Clínica</label>
                <input type="text" name="clinica" class="form-control" value="{{dados.clinica}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">Especialidade</label>
                <select name="especialidade" class="form-select" >
                    <option value="">Selecione</option>
                    <option value="cardiologia" {{#isCardio}}selected{{/isCardio}}>Cardiologia</option>
                    <option value="dermatologia" {{#isDerma}}selected{{/isDerma}}>Dermatologia</option>
                    <option value="neurologia" {{#isNeuro}}selected{{/isNeuro}}>Neurologia</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Data da Consulta</label>
                <input type="date" name="dataconsulta" class="form-control" value="{{dados.dataconsulta}}" >
            </div>

            <div class="col-md-6">
                <label class="form-label">Horário</label>
                <input type="time" name="horario" class="form-control" value="{{dados.horario}}" >
            </div>

            <div class="col-12">
                <label class="form-label">Observação</label>
                <textarea name="observacao" class="form-control">{{dados.observacao}}</textarea>
            </div>

        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary w-100">
                Enviar
            </button>
        </div>

    </form>
</div>
    
</body>
</html>
